<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Morard Automotores - Colón, Entre Ríos</title>
    <!-- Fuentes de Google -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;800;900&family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
    <!-- FontAwesome para iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Roboto', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
        }

        /* Contenedor principal alineado arriba para compactar los espacios */
        .card-container {
            width: 100%;
            max-width: 440px;
            min-height: 100vh;
            background: linear-gradient(rgba(5, 7, 12, 0.82), rgba(2, 3, 5, 0.92)), url('auto.jpg');
            background-size: cover;
            background-position: center;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.95);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start; /* Alinea todo arriba para eliminar espacios muertos */
            padding: 12px 16px 20px 16px;
            position: relative;
            box-sizing: border-box;
            gap: 12px; /* Espacio controlado entre bloques */
        }

        .card-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% 30%, rgba(10, 30, 60, 0.4) 0%, rgba(0, 0, 0, 0.85) 80%);
            pointer-events: none;
            z-index: 1;
        }

        .card-container > * {
            position: relative;
            z-index: 2;
        }

        @media (min-width: 480px) {
            .card-container {
                min-height: 88vh;
                border-radius: 24px;
                border: 1px solid rgba(255, 255, 255, 0.1);
            }
        }

        .header-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            width: 100%;
            margin-top: 4px;
        }

        .logo-wrapper {
            width: 100%;
            max-width: 190px;
            overflow: hidden;
            margin-bottom: 4px;
        }

        .logo-wrapper img {
            width: 100%;
            height: auto;
            display: block;
            filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.8));
        }

        .address-tag {
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            font-size: 0.68rem;
            letter-spacing: 0.8px;
            color: #cbd5e0;
            text-transform: uppercase;
            background: rgba(0, 0, 0, 0.5);
            padding: 4px 10px;
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .links-container {
            display: flex;
            flex-direction: column;
            gap: 8px; /* Espacio cómodo entre burbujas sin achicarlas */
            width: 100%;
        }

        .social-btn {
            display: flex;
            align-items: center;
            background: rgba(15, 18, 25, 0.75);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 12px;
            padding: 12px 16px; /* Tamaño completo y cómodo original */
            text-decoration: none;
            color: #ffffff;
            font-weight: 500;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .social-btn:hover {
            transform: translateY(-3px);
            background: rgba(25, 30, 40, 0.9);
            box-shadow: 0 6px 20px rgba(234, 43, 43, 0.25);
        }

        .social-btn i {
            font-size: 1.3rem;
            margin-right: 14px;
            width: 24px;
            text-align: center;
        }

        .social-btn .btn-text {
            display: flex;
            flex-direction: column;
        }

        .social-btn .btn-title {
            font-family: 'Montserrat', sans-serif;
            font-weight: 600;
            font-size: 0.85rem;
            letter-spacing: 0.5px;
        }

        .social-btn .btn-subtitle {
            font-size: 0.7rem;
            color: #a0aec0;
            margin-top: 1px;
        }

        .whatsapp:hover { border-color: #25d366; box-shadow: 0 6px 20px rgba(37, 211, 102, 0.3); }
        .whatsapp i { color: #25d366; }

        .instagram:hover { border-color: #e1306c; box-shadow: 0 6px 20px rgba(225, 48, 108, 0.3); }
        .instagram i { color: #e1306c; }

        .facebook:hover { border-color: #1877f2; box-shadow: 0 6px 20px rgba(24, 119, 242, 0.3); }
        .facebook i { color: #1877f2; }

        .maps:hover { border-color: #ea4335; box-shadow: 0 6px 20px rgba(234, 67, 53, 0.3); }
        .maps i { color: #ea4335; }

        .footer {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            text-align: center;
            font-size: 0.65rem;
            color: #a0aec0;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            padding: 6px 20px;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(4px);
            border-radius: 8px;
            margin-top: auto; /* Empuja el footer exactamente a la altura donde marcaste la línea violeta */
            width: 100%;
            max-width: 220px;
        }

        .footer-brand {
            display: flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
            color: #ffffff;
            font-weight: 500;
        }

        .footer-brand img {
            width: 18px;
            height: 18px;
            border-radius: 4px;
            object-fit: cover;
        }

        .footer-brand span {
            color: #00d9ff;
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

    <div class="card-container">
        <!-- Cabecera, Logo y Dirección -->
        <div class="header-content">
            <div class="logo-wrapper">
                <img src="logo.png" alt="Morard Automotores Logo">
            </div>
            <div class="address-tag">Avenida San Martín 1041, Colón, Entre Ríos</div>
        </div>

        <!-- Botones de Redes y Contacto (Subidos hacia arriba) -->
        <div class="links-container">
            <a href="https://wa.me/5493447547736" target="_blank" class="social-btn whatsapp">
                <i class="fa-brands fa-whatsapp"></i>
                <div class="btn-text">
                    <span class="btn-title">WhatsApp</span>
                    <span class="btn-subtitle">Consultas y Ventas</span>
                </div>
            </a>

            <a href="https://www.instagram.com/morardautomotores?stkn=MTF2dHdrNzNveDN5OQ==" target="_blank" class="social-btn instagram">
                <i class="fa-brands fa-instagram"></i>
                <div class="btn-text">
                    <span class="btn-title">Instagram</span>
                    <span class="btn-subtitle">Catálogo de vehículos y novedades</span>
                </div>
            </a>

            <a href="https://www.facebook.com/share/19aSjcPKwr/" target="_blank" class="social-btn facebook">
                <i class="fa-brands fa-facebook"></i>
                <div class="btn-text">
                    <span class="btn-title">Facebook</span>
                    <span class="btn-subtitle">Seguinos en nuestra página</span>
                </div>
            </a>

            <a href="https://maps.app.goo.gl/P4UHdFUhesiLqXW68" target="_blank" class="social-btn maps">
                <i class="fa-solid fa-location-dot"></i>
                <div class="btn-text">
                    <span class="btn-title">Ubicación / Salón</span>
                    <span class="btn-subtitle">Av. San Martín 1041, Colón</span>
                </div>
            </a>
        </div>

        <!-- Pie de página posicionado exactamente donde indicaste -->
        <div class="footer">
            <span>Powered by</span>
            <a href="#" class="footer-brand">
                <img src="logo-3dlab.png" alt="3D LAB Logo">
                <span>3D LAB</span>
            </a>
        </div>
    </div>

</body>
</html>
